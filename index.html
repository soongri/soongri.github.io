<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Key & Chord Analyzer</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --primary: #8b5cf6;
      --primary-2: #a78bfa;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --line: rgba(148, 163, 184, 0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #020817 0%, #111827 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 32px 20px 60px;
    }

    .app {
      width: min(1200px, 100%);
    }

    .header {
      margin-bottom: 24px;
      padding: 20px 24px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .upload-card, .card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .upload-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .file-box {
      flex: 1 1 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-weight: 600;
      color: var(--muted);
    }

    input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(31, 41, 55, 0.8);
      color: var(--text);
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      min-height: 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .stats {
      list-style: none;
      padding: 0;
      margin: 0 0 20px;
      display: grid;
      gap: 12px;
    }

    .stats li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(31, 41, 55, 0.35);
    }

    .stats strong {
      color: white;
      font-weight: 700;
    }

    .transpose-box {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .transpose-box .row {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .shift-value {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(167, 139, 250, 0.15);
      border: 1px solid rgba(167, 139, 250, 0.3);
      color: #ddd6fe;
      font-weight: 700;
      min-width: 80px;
      text-align: center;
    }

    .transposed-box {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .chip {
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #d1fae5;
      font-weight: 700;
      font-size: 0.9rem;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      padding: 14px 16px;
      font-size: 1rem;
      line-height: 1.6;
    }

    .chord-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chord-item {
      min-width: 90px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.35);
      text-align: center;
      font-weight: 700;
    }

    .small-note {
      font-size: 0.8rem;
      color: var(--muted);
      display: block;
      margin-top: 4px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Song Key & Chord Analyzer</h1>
      <p>음성 파일을 업로드하면 기본적인 키와 코드 진행을 추정하고, 키를 올리거나 낮춰서 코드도 함께 바꾸는 도구입니다.</p>
    </header>

    <section class="upload-card">
      <div class="file-box">
        <label for="audioFile">오디오 파일 업로드</label>
        <input id="audioFile" type="file" accept="audio/*" />
      </div>
      <button id="analyzeBtn" type="button">분석 시작</button>
    </section>

    <div id="status" class="status">음원을 업로드하면 분석을 시작할 수 있습니다.</div>

    <div class="grid">
      <section class="card">
        <h2>분석 결과</h2>
        <div class="meta">
          <span id="fileName">파일: 없음</span>
          <span id="duration">길이: --</span>
        </div>

        <ul class="stats">
          <li><span>감지된 키</span><strong id="detectedKey">--</strong></li>
          <li><span>추정 BPM</span><strong id="bpm">--</strong></li>
          <li><span>기본 코드 진행</span><strong id="basicChords">--</strong></li>
        </ul>

        <div class="transpose-box">
          <div class="row">
            <label for="transposeRange">키 전환</label>
            <span id="transposeValue" class="shift-value">0 반음</span>
          </div>
          <input id="transposeRange" type="range" min="-6" max="6" value="0" />
        </div>

        <div>
          <strong>변환된 코드</strong>
          <div id="transposedChords" class="transposed-box"></div>
        </div>
      </section>

      <section class="card">
        <h2>가사 편집</h2>
        <textarea id="lyricsBox">Verse 1
오늘의 노래를 업로드하면
가사 텍스트를 입력하거나 수정할 수 있습니다.

Verse 2
코드가 바뀌어도
가사는 그대로 유지됩니다.
</textarea>
      </section>
    </div>

    <section class="card">
      <h2>코드 맵</h2>
      <div id="chordGrid" class="chord-grid"></div>
    </section>
  </div>

  <script>
    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    const audioFileInput = document.getElementById("audioFile");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const statusBox = document.getElementById("status");
    const fileNameBox = document.getElementById("fileName");
    const durationBox = document.getElementById("duration");
    const detectedKeyBox = document.getElementById("detectedKey");
    const bpmBox = document.getElementById("bpm");
    const basicChordsBox = document.getElementById("basicChords");
    const transposeRange = document.getElementById("transposeRange");
    const transposeValue = document.getElementById("transposeValue");
    const transposedChordsBox = document.getElementById("transposedChords");
    const chordGridBox = document.getElementById("chordGrid");

    let baseProgression = ["C", "G", "Am", "F"];
    let baseKey = "C Major";

    function noteToSemitone(noteName) {
      const idx = NOTE_NAMES.indexOf(noteName);
      return idx >= 0 ? idx : 0;
    }

    function frequencyToNote(frequency) {
      if (!frequency || frequency < 20) return null;
      const midi = 69 + 12 * Math.log2(frequency / 440);
      const noteIndex = Math.round(midi) % 12;
      return NOTE_NAMES[noteIndex < 0 ? noteIndex + 12 : noteIndex];
    }

    function detectPitch(signal, sampleRate) {
      const minLag = Math.floor(sampleRate / 1000);
      const maxLag = Math.floor(sampleRate / 40);
      let bestLag = 0;
      let bestCorrelation = 0;

      for (let lag = minLag; lag < maxLag; lag++) {
        let correlation = 0;
        for (let i = 0; i < signal.length - lag; i++) {
          correlation += signal[i] * signal[i + lag];
        }

        if (correlation > bestCorrelation) {
          bestCorrelation = correlation;
          bestLag = lag;
        }
      }

      if (!bestLag) return 0;
      return sampleRate / bestLag;
    }

    function getModeFromRoot(rootName, histogram) {
      const rootIndex = noteToSemitone(rootName);
      const majorScore = [0, 2, 4, 5, 7, 9, 11].reduce((sum, step) => {
        const note = NOTE_NAMES[(rootIndex + step) % 12];
        return sum + (histogram[note] || 0);
      }, 0);

      const minorScore = [0, 2, 3, 5, 7, 8, 10].reduce((sum, step) => {
        const note = NOTE_NAMES[(rootIndex + step) % 12];
        return sum + (histogram[note] || 0);
      }, 0);

      return majorScore >= minorScore ? "major" : "minor";
    }

    function buildProgressionFromRoot(rootName, mode) {
      const rootIndex = noteToSemitone(rootName);
      const fourthIndex = (rootIndex + 5) % 12;
      const fifthIndex = (rootIndex + 7) % 12;
      const relativeMinorIndex = (rootIndex + 9) % 12;

      const majorPattern = [
        `${NOTE_NAMES[rootIndex]}maj`,
        `${NOTE_NAMES[fifthIndex]}maj`,
        `${NOTE_NAMES[relativeMinorIndex]}m`,
        `${NOTE_NAMES[fourthIndex]}maj`
      ];

      const minorPattern = [
        `${NOTE_NAMES[rootIndex]}m`,
        `${NOTE_NAMES[(rootIndex + 3) % 12]}m`,
        `${NOTE_NAMES[(rootIndex + 7) % 12]}maj`,
        `${NOTE_NAMES[(rootIndex + 5) % 12]}m`
      ];

      return mode === "major" ? majorPattern : minorPattern;
    }

    function transposeChord(chordName, shift) {
      const match = chordName.match(/^([A-G]#?)(.*)$/);
      if (!match) return chordName;

      const root = match[1];
      const suffix = match[2] || "";
      const rootIndex = NOTE_NAMES.indexOf(root);
      const newIndex = (rootIndex + shift + 12) % 12;
      const newRoot = NOTE_NAMES[newIndex];

      if (suffix === "maj") return `${newRoot}maj`;
      if (suffix === "m") return `${newRoot}m`;
      if (suffix === "dim") return `${newRoot}dim`;
      if (suffix === "sus2") return `${newRoot}sus2`;
      if (suffix === "sus4") return `${newRoot}sus4`;

      return `${newRoot}${suffix}`;
    }

    function estimateBpm(durationSeconds, pitchArray) {
      if (!pitchArray.length || durationSeconds <= 0) return 0;
      const cycles = Math.max(1, pitchArray.length / 4);
      const tempo = 60 / (durationSeconds / cycles);
      return Math.max(60, Math.min(180, Math.round(tempo)));
    }

    function renderChordGrid(chords) {
      chordGridBox.innerHTML = "";
      chords.forEach((chord, idx) => {
        const item = document.createElement("div");
        item.className = "chord-item";
        item.innerHTML = `<span>${chord}</span><small class="small-note">${idx + 1}번 코드</small>`;
        chordGridBox.appendChild(item);
      });
    }

    function updateTransposedChords() {
      const shift = Number(transposeRange.value);
      transposeValue.textContent = `${shift} 반음`;

      const transposed = baseProgression.map((chord) => transposeChord(chord, shift));
      transposedChordsBox.innerHTML = "";
      transposed.forEach((chord) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = chord;
        transposedChordsBox.appendChild(chip);
      });

      basicChordsBox.textContent = `${baseKey} | ${baseProgression.join(" / ")}`;
      renderChordGrid(transposed);
    }

    function analyzeAudio(file) {
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          statusBox.textContent = "오디오 디코딩 중...";
          analyzeBtn.disabled = true;

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioContextClass();
          const arrayBuffer = reader.result;
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
          const sampleRate = audioBuffer.sampleRate;
          const duration = audioBuffer.duration;
          const channelData = audioBuffer.getChannelData(0);

          const mono = new Float32Array(channelData.length);
          for (let i = 0; i < channelData.length; i++) {
            const left = channelData[i];
            const right = audioBuffer.numberOfChannels > 1 ? audioBuffer.getChannelData(1)[i] : left;
            mono[i] = (left + right) / 2;
          }

          const frameSize = 2048;
          const hopSize = 1024;
          const detectedFrequencies = [];

          for (let start = 0; start + frameSize < mono.length; start += hopSize) {
            const frame = mono.slice(start, start + frameSize);
            let rms = 0;
            for (let i = 0; i < frame.length; i++) rms += frame[i] * frame[i];
            rms = Math.sqrt(rms / frame.length);

            if (rms < 0.02) continue;

            const pitch = detectPitch(frame, sampleRate);
            if (pitch > 50 && pitch < 1000) {
              detectedFrequencies.push(pitch);
            }
          }

          const histogram = {};
          for (const freq of detectedFrequencies) {
            const note = frequencyToNote(freq);
            if (note) {
              histogram[note] = (histogram[note] || 0) + 1;
            }
          }

          const topNote = Object.entries(histogram).sort((a, b) => b[1] - a[1])[0];
          const rootName = topNote ? topNote[0] : "C";
          const mode = getModeFromRoot(rootName, histogram);
          const detectedKeyText = `${rootName} ${mode === "major" ? "Major" : "Minor"}`;
          const estimatedBpm = estimateBpm(duration, detectedFrequencies);

          baseProgression = buildProgressionFromRoot(rootName, mode);
          baseKey = detectedKeyText;

          fileNameBox.textContent = `파일: ${file.name}`;
          durationBox.textContent = `길이: ${duration.toFixed(2)}초`;
          detectedKeyBox.textContent = detectedKeyText;
          bpmBox.textContent = `${estimatedBpm} BPM`;
          basicChordsBox.textContent = `${detectedKeyText} | ${baseProgression.join(" / ")}`;

          renderChordGrid(baseProgression);
          updateTransposedChords();
          statusBox.textContent = "분석 완료. 키를 조절해 보세요.";
          analyzeBtn.disabled = false;

          await audioCtx.close();
        } catch (error) {
          statusBox.textContent = "분석 중 오류가 발생했습니다. 다른 오디오 파일을 시도해 보세요.";
          console.error(error);
          analyzeBtn.disabled = false;
        }
      };

      reader.readAsArrayBuffer(file);
    }

    analyzeBtn.addEventListener("click", () => {
      const file = audioFileInput.files[0];
      if (!file) {
        statusBox.textContent = "먼저 오디오 파일을 선택해 주세요.";
        return;
      }
      analyzeAudio(file);
    });

    transposeRange.addEventListener("input", updateTransposedChords);

    renderChordGrid(baseProgression);
    updateTransposedChords();
  </script>
</body>
</html>
